; FlowGate server test configuration — flowgate.default.0394 T0004 (R0001 §6, NR0003 §13-12).
;
; This file did not exist before. The repository had no pytest.ini, pyproject.toml or
; setup.cfg, and conftest.py declared no markers, so there was nowhere to hang an
; execution tier — R0001 §6 asks for Fast / Standard / Full, and the first thing that
; needed building was somewhere to put them.
;
; Pick a tier with `--tier`:
;
;   python -m pytest tests --tier=fast       개발 중 빠른 회귀 확인
;   python -m pytest tests --tier=standard   작업 완료 검증
;   python -m pytest tests                   release / 대규모 리팩터링 (= full, the default)
;
; The default is full, deliberately: a plain `pytest tests` must keep meaning "everything",
; so no existing habit or script quietly starts running less than it did.
;
; How a test lands in a tier is documented in tests/conftest.py (`_tier_for_module`).
; Measured on 2026-08-08 (NR0003 §10.2, sqlite, 1 process):
;   fast     ~113 files / 1,414 tests / 108s
;   standard ~171 files / 2,459 tests / 341s
;   full      213 files / 3,223 tests / 474s

[pytest]
markers =
    fast: Level 1 — no TestClient, no subprocess/git, no sleep. Runs during development.
    standard: Level 2 — Level 1 plus service/API tests; excludes git, e2e and dialect work.
    full: Level 3 — everything, including the slow integration and dialect suites.
    postgres: opt-in — needs a live PostgreSQL server (FLOWGATE_PG_TEST_DSN). Skipped otherwise.
