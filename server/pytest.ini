; FlowGate server test configuration — flowgate.default.0394 T0004 (R0001 §6, NR0003 §13-12).
;
; This file did not exist before. The repository had no pytest.ini, pyproject.toml or
; setup.cfg, and conftest.py declared no markers, so there was nowhere to hang an
; execution tier — R0001 §6 asks for Fast / Standard / Full, and the first thing that
; needed building was somewhere to put them.
;
; Pick a tier with `--tier` (cumulative: a tier also runs the ones below it):
;
;   python -m pytest tests --changed=<path> --tier=veryfast   frequently while editing (1s or less per file)
;   python -m pytest tests --changed=<path> --tier=fast       right after finishing a chunk of work (5s or less)
;   python -m pytest tests --changed=<path>                   when finishing a card (= standard, 15s or less)
;   python -m pytest tests --area=<area> --tier=heavy         after a large change to that area (30s or less)
;   python -m pytest tests --area=<area> --tier=slow          risky changes such as migrations or git integration (120s or less)
;   python -m pytest tests --install-check                    install check: everything, including e2e and files over 120s
;
; The default is standard. There is no "full" tier: running everything is the install
; check, asked for by name, and it also fails on missing host capabilities.
;
; How a test lands in a tier is documented in tests/conftest.py (`_tier_for_module`);
; the limits live in tests/timing_support.py and the measured numbers in TESTING.md.
; Self-check runs reserve logical processors (request field parallel_share, default 1) under a
; host-wide cap and run on the granted processors only; use `-n <share> --dist loadfile` with the
; same parallel_share for large selections (TESTING.md, "Parallel execution in Self-check").

[pytest]
markers =
    area(name): module-level test owner; overrides areas.toml test patterns.
    veryfast: tier 1 — file runs in 1s or less. Runs constantly while editing.
    fast: tier 2 — 5s or less. Runs after each finished chunk of work.
    standard: tier 3 — 15s or less. The default; runs when a card is finished.
    heavy: tier 4 — 30s or less. Runs when its area was changed substantially.
    slow: tier 5 — 120s or less. Runs only for risky changes (migrations, git integration).
    install: no tier — runs only under --install-check (e2e, files over the slow limit).
    postgres: opt-in — needs a live PostgreSQL server (FLOWGATE_PG_TEST_DSN). Skipped otherwise.
    mysql: opt-in — needs a live MySQL server (FLOWGATE_MYSQL_TEST_DSN). Skipped otherwise.
    timeout: per-test hang limit in seconds (tests/hang_guard.py; same name as pytest-timeout's marker). Default FLOWGATE_TEST_TIMEOUT or 900.
