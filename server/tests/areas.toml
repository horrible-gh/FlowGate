# Paths are relative to server/. Test ownership is explicit: new files must be mapped.
# Areas are split into sub-areas ("parent.sub"): --area=parent selects every parent.*,
# --changed selects only the sub-areas whose source globs match (the union when several do).
# A source glob shared by all sub-areas of a parent could not be attributed to one of them.
# git.core and graph.definition keep the whole package glob; a shared file there (command.py,
# lock_manager.py, graph_model.py, flow_guard.py ...) is also listed under every sibling whose
# source imports it directly, so changing it runs those siblings too. When a sibling starts
# importing another shared file, add that file to the sibling's source list.
# also lists additional areas included from standard upward (one hop, no recursion).
# Targets per sub-area: at most 40 test files, standard within 60s on 2 workers
# (python tools/test_budget.py reports what is over).
# Dotted area names must be quoted, e.g. [area."ai.invoke"].
