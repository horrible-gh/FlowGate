name: 0612 Verify
on:
  pull_request:
    branches: [main]

jobs:
  git-branch-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- tests/main/GitBranchManager.spec.ts
