name: 0612 Verify
on:
  pull_request:
    branches: [main]

jobs:
  git-branch-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Verify fixed component
        run: npm test -- tests/main/GitBranchManager.spec.ts
      - name: Verify regression test fails against main component
        shell: bash
        run: |
          git show origin/main:client/src/main/components/GitBranchManager.vue > src/main/components/GitBranchManager.vue
          if npm test -- tests/main/GitBranchManager.spec.ts -t "C2b. changing the persistent target"; then
            echo "ERROR: regression test unexpectedly passed against the unfixed main component"
            exit 1
          fi
          echo "Expected pre-fix failure reproduced"
