name: FlowGate CI

on:
  push:
    branches:
      - feature/v0.2.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m compileall -q server
      - name: Install server test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Check remote job lifecycle
        working-directory: server
        env:
          FLOWGATE_TEST_TIMEOUT: '120'
        run: >-
          python -m pytest -q --disable-warnings
          tests/modules/flow_gate/test_remote_unlimited_timeout.py
          tests/modules/flow_gate/test_agent_jobs_0636.py
          tests/modules/flow_gate/test_agent_jobs_boolean_sql_0135.py
          tests/modules/flow_gate/test_remote_cli_routing_0129.py
          tests/modules/flow_gate/test_agent_capacity_0043.py

  client:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client_gui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client_gui/package-lock.json
      - run: npm ci
      # `npm run build` = vue-tsc -b (TypeScript check) && vite build (production build)
      - run: npm run build
        env:
          VITE_API_BASE_URL: /flowgate
